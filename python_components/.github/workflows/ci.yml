name: riskbeacon-ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Prevent heavy model downloads/initialization in CI
      RISKBEACON_DISABLE_FINBERT: "true"
      # Make test output deterministic-ish
      PYTHONHASHSEED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (minimal for tests)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install fastapi uvicorn[standard] pandas numpy requests plotly pydantic pydantic-settings

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=api --cov=controllers --cov=services --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Export Great Expectations suites (docs artifacts)
        run: |
          python -m test.data_validation.run_data_validation

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/

      - name: Upload GX suite artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gx-suites
          path: |
            docs/data_validation/gx_suites/

