name: mutation-testing

on:
  workflow_dispatch:

jobs:
  mutmut:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_components
    env:
      RISKBEACON_DISABLE_FINBERT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            python_components/requirements-mutation.txt

      - name: Install minimal deps (mutation)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-mutation.txt

      - name: Mutmut (VPIN only - simplified)
        run: |
          rm -rf .mutmut-cache || true
          # Temporarily rename pytest.ini to avoid conflicts
          mv pytest.ini pytest.ini.backup 2>/dev/null || true
          # Create minimal pytest.ini for mutmut that allows test discovery
          cat > pytest.ini <<'EOF'
          [pytest]
          testpaths = test/unit_testing/service_modules test/unit_testing/Quant_services
          python_files = test_*.py
          python_classes = Test*
          python_functions = test_*
          addopts = -v
          EOF
          # Verify pytest can discover tests before mutmut runs
          python -m pytest --collect-only test/unit_testing/service_modules/test_vpin_service.py test/unit_testing/Quant_services/test_vpin_invariants.py || echo "Pytest collection warning (may still work)"
          cat > setup.cfg <<'EOF'
          [mutmut]
          paths_to_mutate=services/vpin_service.py
          runner=python -m pytest test/unit_testing/service_modules/test_vpin_service.py test/unit_testing/Quant_services/test_vpin_invariants.py --rootdir={mutations_directory} -v
          also_copy=
              backend
              services
              utils
              test/unit_testing/service_modules
              test/unit_testing/Quant_services
              test/conftest.py
          EOF
          # Ensure imports resolve inside the mutmut sandbox
          export PYTHONPATH="$PWD/mutants:$PWD"
          # Run mutation testing (allow failure but capture output)
          python -m mutmut run 2>&1 | tee mutmut_run.log || echo "Mutation testing completed with warnings"
          python -m mutmut results > mutmut_results_vpin.txt 2>&1 || echo "No results available" > mutmut_results_vpin.txt
          echo "=== Mutation Testing Summary ===" >> mutmut_results_vpin.txt
          echo "Mutants generated: $(python -m mutmut list | wc -l)" >> mutmut_results_vpin.txt || echo "Mutants generated: (count unavailable)" >> mutmut_results_vpin.txt
          cat mutmut_results_vpin.txt
          # Restore original pytest.ini
          mv pytest.ini.backup pytest.ini 2>/dev/null || true
          rm -f setup.cfg || true

      - name: Upload mutmut results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutmut-results
          path: |
            python_components/mutmut_results_vpin.txt
            python_components/mutmut_run.log
