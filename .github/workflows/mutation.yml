name: mutation-testing

on:
  workflow_dispatch:

jobs:
  mutmut:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_components
    env:
      RISKBEACON_DISABLE_FINBERT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            python_components/requirements-mutation.txt

      - name: Install minimal deps (mutation)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-mutation.txt

      - name: Mutmut (VPIN only - simplified)
        run: |
          rm -rf .mutmut-cache || true
          cat > setup.cfg <<'EOF'
          [mutmut]
          paths_to_mutate=services/vpin_service.py
          runner=python -m pytest test/unit_testing/service_modules/test_vpin_service.py test/unit_testing/Quant_services/test_vpin_invariants.py --rootdir={mutations_directory} -q
          also_copy=
              backend
              services
              utils
              test/unit_testing/service_modules/test_vpin_service.py
              test/unit_testing/Quant_services/test_vpin_invariants.py
              test/conftest.py
          EOF
          # Ensure imports resolve inside the mutmut sandbox
          export PYTHONPATH="$PWD/mutants:$PWD"
          # Run mutation testing
          python -m mutmut run
          python -m mutmut results > mutmut_results_vpin.txt || true
          cat mutmut_results_vpin.txt
          rm -f setup.cfg || true

      - name: Upload mutmut results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutmut-results
          path: |
            python_components/mutmut_results_vpin.txt
