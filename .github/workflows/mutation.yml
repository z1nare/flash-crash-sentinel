name: mutation-testing

on:
  workflow_dispatch:

jobs:
  mutmut:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_components
    env:
      RISKBEACON_DISABLE_FINBERT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            python_components/requirements-mutation.txt

      - name: Install minimal deps (mutation)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-mutation.txt

      - name: Mutmut (VPIN)
        run: |
          python -m mutmut run --paths-to-mutate services/vpin_service.py --runner "python -m pytest -q test/unit_testing/service_modules/test_vpin_service.py test/unit_testing/Quant_services/test_vpin_invariants.py"
          python -m mutmut results > mutmut_results_vpin.txt || true

      - name: Mutmut (Volatility)
        run: |
          python -m mutmut run --paths-to-mutate services/vol_service.py --runner "python -m pytest -q test/unit_testing/service_modules/test_vol_service.py test/unit_testing/Quant_services/test_vol_yang_zhang_invariants.py"
          python -m mutmut results > mutmut_results_vol.txt || true

      - name: Collect summary
        run: |
          echo "==== mutmut results (VPIN) ====" > mutmut_summary.txt
          cat mutmut_results_vpin.txt >> mutmut_summary.txt
          echo "" >> mutmut_summary.txt
          echo "==== mutmut results (Volatility) ====" >> mutmut_summary.txt
          cat mutmut_results_vol.txt >> mutmut_summary.txt

      - name: Upload mutmut results
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-results
          path: |
            python_components/mutmut_summary.txt
            python_components/mutmut_results_vpin.txt
            python_components/mutmut_results_vol.txt
